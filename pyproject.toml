[project]
name = "deploy-barometer"
version = "1.1.0"
description = "Shows shouldideploy.today on a BUSY Bar, with 8-bit sound."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "LICENSING.md"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "busylib>=1.4",
    "pydantic-settings>=2.4",
    "zeroconf>=0.130",
]

[project.optional-dependencies]
# Only the calibration and verification scripts need to read the framebuffer.
calibration = ["pillow>=10.0"]

[project.scripts]
deploy-barometer = "barometer.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["barometer"]

[tool.setuptools.package-data]
barometer = ["font_metrics.json"]
